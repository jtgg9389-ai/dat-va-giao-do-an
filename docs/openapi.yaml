                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
        description: MongoDB ObjectId.
    patch:
      summary: Phản hồi hoặc đóng khiếu nại
      operationId: patch_admin_complaints_id
      tags:
      - Admin
      description: ''
      x-implementation-status: implemented
      x-roles:
      - admin
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  complaint:
                    $ref: '#/components/schemas/Complaint'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái hoặc dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
        description: MongoDB ObjectId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - IN_REVIEW
                  - RESOLVED
                  - REJECTED
                resolution:
                  type: string
                  minLength: 5
                  maxLength: 500
                  description: Bắt buộc khi RESOLVED/REJECTED.
                message:
                  type: string
                  maxLength: 1000
              description: Cần status hoặc message không rỗng; chỉ sửa hồ sơ còn OPEN/IN_REVIEW.
components:
