openapi: 3.0.3
info:
  title: API ứng dụng Đặt và Giao đồ ăn — hiện trạng
  version: 1.0.0
  description: Đặc tả các route có trong mã Express tại thời điểm lập tài liệu. Không khẳng định mọi route đã được
    kiểm thử. Thiết kế tương lai /api/v1 xem docs/api-design.md. Swagger UI được phục vụ tại /api-docs/.
servers:
- url: http://localhost:5000/api
  description: Backend phát triển cục bộ
security:
- bearerAuth: []
tags:
- name: Auth
- name: Restaurants
- name: Restaurant
- name: Orders
- name: Complaints
- name: Admin
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản
      operationId: post_auth_register
      tags:
      - Auth
      description: Mật khẩu bcrypt; email lowercase. Có tồn tại quyền tự đăng ký admin trong mã hiện tại; không
        xem đó là thiết kế an toàn.
      x-implementation-status: implemented
      x-roles:
      - public
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId: &id001
                    type: string
                    pattern: ^[0-9a-fA-F]{24}$
                    example: 507f1f77bcf86cd799439011
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái hoặc dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      summary: Đăng nhập
      operationId: post_auth_login
      tags:
      - Auth
      description: JWT hết hạn sau 7 ngày; hiện chưa có refresh/logout/thu hồi token.
      x-implementation-status: implemented
      x-roles:
      - public
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id: *id001
                      name:
                        type: string
                      email:
                        type: string
                      role: &id005
                        type: string
                        enum: &id012
                        - customer
                        - restaurant
                        - driver
                        - admin
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/profile:
    get:
      summary: Lấy hồ sơ của mình
      operationId: get_auth_profile
      tags:
      - Auth
      description: ''
      x-implementation-status: implemented
      x-roles: &id002
      - customer
      - restaurant
      - driver
      - admin
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Cập nhật một phần hồ sơ
      operationId: put_auth_profile
      tags:
      - Auth
      description: ''
      x-implementation-status: implemented
      x-roles: *id002
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
  /auth/change-password:
    put:
      summary: Đổi mật khẩu
      operationId: put_auth_change_password
      tags:
      - Auth
      description: Mật khẩu mới phải khác hiện tại. JWT cũ hiện chưa bị thu hồi.
      x-implementation-status: implemented
      x-roles: *id002
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  minLength: 6
                  format: password
              required:
              - currentPassword
              - newPassword
  /restaurants:
    get:
      summary: Danh sách quán đã duyệt
      operationId: get_restaurants
      tags:
      - Restaurants
      description: Loại chủ quán bị khóa; sắp isOpen giảm dần rồi tên; chưa có lọc địa lý/đánh giá hoặc phân trang.
      x-implementation-status: implemented
      x-roles: *id002
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicRestaurant'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /restaurants/{id}:
    get:
      summary: Chi tiết quán và thực đơn
      operationId: get_restaurants_id
      tags:
      - Restaurants
      description: Menu gồm cả món hết hàng; quán phải được duyệt, chủ không bị khóa.
      x-implementation-status: implemented
      x-roles: *id002
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant:
                    $ref: '#/components/schemas/PublicRestaurant'
                  menu:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
        description: MongoDB ObjectId.
  /restaurants/mine:
    get:
      summary: Lấy quán và menu của mình
      operationId: get_restaurants_mine
      tags:
      - Restaurant
      description: Chưa tạo quán trả restaurant=null, menu=[].
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant:
                    type: object
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/Restaurant'
                  menu:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Tạo hoặc sửa quán của mình
      operationId: put_restaurants_mine
      tags:
      - Restaurant
      description: ''
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  restaurant:
                    $ref: '#/components/schemas/Restaurant'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantUpdate'
  /restaurants/mine/menu:
    post:
      summary: Thêm món
      operationId: post_restaurants_mine_menu
      tags:
      - Restaurant
      description: ''
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: '#/components/schemas/MenuItem'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreate'
  /restaurants/mine/menu/{itemId}:
    put:
      summary: Sửa món hoặc trạng thái còn hàng
      operationId: put_restaurants_mine_menu_itemId
      tags:
      - Restaurant
      description: ''
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: '#/components/schemas/MenuItem'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: itemId
        in: path
        required: true
        schema: *id001
        description: MongoDB ObjectId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdate'
    delete:
      summary: Xóa món của quán
      operationId: delete_restaurants_mine_menu_itemId
      tags:
      - Restaurant
      description: Hiện xóa cứng MenuItem; đơn giữ snapshot nên tên/giá đơn cũ không đổi.
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: itemId
        in: path
        required: true
        schema: *id001
        description: MongoDB ObjectId.
  /orders:
    post:
      summary: Tạo đơn COD từ menu
      operationId: post_orders
      tags:
      - Orders
      description: Quán mở/được duyệt, chủ không khóa. Giá do server tính, hoa hồng 10%. Chưa có phí giao/quote.
        Cùng customer+key trả đơn cũ; hiện chưa so sánh payload khi tái dùng key.
      x-implementation-status: implemented
      x-roles:
      - customer
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái hoặc dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Trả đơn đã tồn tại cho cùng khách và Idempotency-Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,100}$
        description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
  /restaurants/mine/orders:
    get:
      summary: 200 đơn gần nhất của quán
      operationId: get_restaurants_mine_orders
      tags:
      - Restaurant
      description: ''
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /restaurants/mine/orders/{orderId}/status:
    patch:
      summary: Xác nhận, từ chối hoặc cập nhật chế biến
      operationId: patch_restaurants_mine_orders_orderId_status
      tags:
      - Restaurant
      description: PENDING_CONFIRMATION → CONFIRMED/REJECTED; CONFIRMED → PREPARING → READY_FOR_PICKUP. Atomic compare-and-set;
        không thuộc quán hoặc trạng thái cũ không khớp trả 409.
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái hoặc dữ liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: orderId
        in: path
        required: true
        schema: *id001
        description: MongoDB ObjectId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
  /restaurants/mine/orders/stream:
    get:
      summary: Stream đơn của quán bằng SSE
      operationId: get_restaurants_mine_orders_stream
      tags:
      - Restaurant
      description: 'Fetch với Bearer header. Snapshot data: {orders}; kiểm tra mỗi 2 giây, phát khi đổi; : heartbeat
        khi không đổi. Tối đa 200 đơn. event: unavailable rồi đóng khi lỗi. Token hết hạn/khóa/đổi vai trò đóng
        stream. Không có event ID hay Last-Event-ID; reconnect nhận snapshot mới.'
      x-implementation-status: implemented
      x-roles:
      - restaurant
      responses:
        '200':
          description: Kết nối SSE dài hạn
          content:
            text/event-stream:
              schema:
                type: string
              example: 'data: {"orders":[]}


                : heartbeat


                '
        '500':
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /restaurants/mine/report:
    get:
      summary: Doanh thu và lịch sử kỳ đã chốt
      operationId: get_restaurants_mine_report
