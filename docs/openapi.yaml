            - pending
            - approved
            - rejected
        rejectReason:
          type: string
        reviewedBy:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          example: 507f1f77bcf86cd799439011
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        location: *a16
        cuisine:
          type: string
          maxLength: 50
    PublicRestaurant:
