          type: boolean
        reason:
          type: string
      required:
        - message
    Message:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    User:
      type: object
      properties:
        _id: *a1
        createdAt: *a5
        updatedAt: *a5
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role: *a6
        status:
          type: string
          enum:
            - active
            - locked
        gender:
          type: string
          enum:
            - ""
            - male
            - female
            - other
        birthday:
          type: string
          format: date-time
          nullable: true
        address:
          type: string
        lockReason:
          type: string
        lockedAt:
          type: string
          format: date-time
          nullable: true
        lockedBy:
          oneOf:
            - *a1
