openapi: 3.0.3
info:
  title: API ứng dụng Đặt và Giao đồ ăn — hiện trạng
  version: 2.0.0
  description: API chức năng khách hàng, nhà hàng, tài xế và admin trên MongoDB
    theo lựa chọn hiện tại. Swagger UI /api-docs/. WebSocket xác thực /api/ws
    được mô tả trong docs/full-workflow.md. PostgreSQL/Redis và kiến trúc
    /api/v1 trong bản thiết kế chưa được chuyển vào mã.
servers:
  - url: http://localhost:5000/api
    description: Backend phát triển cục bộ
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Restaurants
  - name: Restaurant
  - name: Orders
  - name: Complaints
  - name: Admin
  - name: Driver
  - name: Notifications & Settlements
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản
      operationId: post_auth_register
      tags:
        - Auth
      description: Chỉ customer/restaurant/driver; nhà hàng và tài xế cần admin duyệt
        hoạt động. Mật khẩu bcrypt, email lowercase.
      x-implementation-status: implemented
      x-roles:
        - public
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId: &a1
                    type: string
                    pattern: ^[0-9a-fA-F]{24}$
                    example: 507f1f77bcf86cd799439011
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Xung đột trạng thái hoặc dữ liệu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
  /auth/login:
    post:
      summary: Đăng nhập
      operationId: post_auth_login
      tags:
        - Auth
      description: JWT hết hạn sau 7 ngày; hiện chưa có refresh/logout/thu hồi token.
      x-implementation-status: implemented
      x-roles:
        - public
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id: *a1
                      name:
                        type: string
                      email:
                        type: string
                      role: &a6
                        type: string
                        enum:
                          - customer
                          - restaurant
                          - driver
                          - admin
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
  /auth/profile:
    get:
      summary: Lấy hồ sơ của mình
      operationId: get_auth_profile
      tags:
        - Auth
      description: ""
      x-implementation-status: implemented
      x-roles: &a2
        - customer
        - restaurant
        - driver
        - admin
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Cập nhật một phần hồ sơ
      operationId: put_auth_profile
      tags:
        - Auth
      description: ""
      x-implementation-status: implemented
      x-roles: *a2
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
  /auth/change-password:
    put:
      summary: Đổi mật khẩu
      operationId: put_auth_change_password
      tags:
        - Auth
      description: Mật khẩu mới phải khác hiện tại. JWT cũ hiện chưa bị thu hồi.
      x-implementation-status: implemented
      x-roles: *a2
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  minLength: 6
                  format: password
              required:
                - currentPassword
                - newPassword
  /restaurants:
    get:
      summary: Danh sách quán đã duyệt
      operationId: get_restaurants
      tags:
        - Restaurants
      description: Loại chủ quán bị khóa; sắp isOpen giảm dần rồi tên; chưa có lọc địa
        lý/đánh giá hoặc phân trang.
      x-implementation-status: implemented
      x-roles: *a2
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicRestaurant"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /restaurants/{id}:
    get:
      summary: Chi tiết quán và thực đơn
      operationId: get_restaurants_id
      tags:
        - Restaurants
      description: Menu gồm cả món hết hàng; quán phải được duyệt, chủ không bị khóa.
      x-implementation-status: implemented
      x-roles: *a2
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant:
                    $ref: "#/components/schemas/PublicRestaurant"
                  menu:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenuItem"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
          description: MongoDB ObjectId.
  /restaurants/mine:
    get:
      summary: Lấy quán và menu của mình
      operationId: get_restaurants_mine
      tags:
        - Restaurant
      description: Chưa tạo quán trả restaurant=null, menu=[].
      x-implementation-status: implemented
      x-roles:
        - restaurant
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Restaurant"
                  menu:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenuItem"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Tạo hoặc sửa quán của mình
      operationId: put_restaurants_mine
      tags:
        - Restaurant
      description: ""
      x-implementation-status: implemented
      x-roles:
        - restaurant
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  restaurant:
                    $ref: "#/components/schemas/Restaurant"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantUpdate"
  /restaurants/mine/menu:
    post:
      summary: Thêm món
      operationId: post_restaurants_mine_menu
      tags:
        - Restaurant
      description: ""
      x-implementation-status: implemented
      x-roles:
        - restaurant
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: "#/components/schemas/MenuItem"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": &a3
          description: Request quá lớn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuCreate"
  /restaurants/mine/menu/{itemId}:
    put:
      summary: Sửa món hoặc trạng thái còn hàng
      operationId: put_restaurants_mine_menu_itemId
      tags:
        - Restaurant
      description: ""
      x-implementation-status: implemented
      x-roles:
        - restaurant
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: "#/components/schemas/MenuItem"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": *a3
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: itemId
          in: path
          required: true
          schema: *a1
          description: MongoDB ObjectId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuUpdate"
    delete:
      summary: Xóa món của quán
      operationId: delete_restaurants_mine_menu_itemId
      tags:
        - Restaurant
      description: Hiện xóa cứng MenuItem; đơn giữ snapshot nên tên/giá đơn cũ không đổi.
      x-implementation-status: implemented
      x-roles:
        - restaurant
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: itemId
          in: path
          required: true
          schema: *a1
          description: MongoDB ObjectId.
  /orders:
    post:
      summary: Tạo đơn COD từ menu
      operationId: post_orders
      tags:
        - Orders
      description: Tạo đơn COD hoặc MOCK_PREPAID; tọa độ giao bắt buộc, quán cần tọa
        độ. Server tính phí 15.000 VND/2 km đầu, mỗi km vượt làm tròn lên +5.000
        VND, giới hạn 30 km. Cùng key khác payload trả 409; khóa cùng key cùng
        payload trả đơn cũ. expectedSubtotal không khớp giá hiện tại trả 409.
      x-implementation-status: implemented
      x-roles:
        - customer
      responses:
        "200":
          description: Trả đơn đã tồn tại cho cùng khách và Idempotency-Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "201":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Xung đột trạng thái hoặc dữ liệu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,100}$
          description: ""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
    get:
      summary: Lịch sử đơn của khách
      tags:
        - Orders
      operationId: get__orders
      description: API triển khai trên MongoDB. Thanh toán/thu chi chỉ là giả lập;
        quyền kiểm tra từ tài khoản hiện tại. Thời gian báo cáo theo Việt Nam.
      x-implementation-status: implemented
      x-roles:
        - customer
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "400":
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu/sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Sai quyền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Xung đột trạng thái/tiền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /restaurants/mine/orders:
    get:
      summary: 200 đơn gần nhất của quán
      operationId: get_restaurants_mine_orders
      tags:
        - Restaurant
      description: ""
      x-implementation-status: implemented
      x-roles:
        - restaurant
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /restaurants/mine/orders/{orderId}/status:
    patch:
      summary: Xác nhận, từ chối hoặc cập nhật chế biến
      operationId: patch_restaurants_mine_orders_orderId_status
      tags:
        - Restaurant
      description: PENDING_CONFIRMATION → CONFIRMED/REJECTED; CONFIRMED → PREPARING →
        READY_FOR_PICKUP. Atomic compare-and-set; không thuộc quán hoặc trạng
        thái cũ không khớp trả 409.
      x-implementation-status: implemented
      x-roles:
        - restaurant
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Thiếu hoặc sai JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Không đủ quyền hoặc tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Xung đột trạng thái hoặc dữ liệu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server
          content:
